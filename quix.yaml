# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Config_App
    application: config_app
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: config-app
  - name: Redis Cache
    application: redis-cache
    version: latest
    deploymentType: Service
    resources:
      cpu: 500
      memory: 1000
      replicas: 1
    network:
      serviceName: redis
      ports:
        - port: 6379
          targetPort: 6379

# This section describes the Topics of the data pipeline
topics:
  - name: tyre-data
    configuration:
      partitions: 1
      replicationFactor: 2
      retentionInMinutes: -1
      retentionInBytes: 52428800
    dataTier: Bronze
